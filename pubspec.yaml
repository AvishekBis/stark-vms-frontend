name: stark_vms_frontend
description: "Stark Group Vehicle Management System - Flutter Web frontend (v2.0)."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: 5.11.1
  flutter_riverpod: 2.6.1
  go_router: 18.1.2
  intl: 0.20.3
  shared_preferences: 2.5.6
  file_picker: 13.1.0
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Display face for headings and figures (ADR 0025). Bundled, not fetched at runtime, so the
  # CanvasKit renderer has it offline and the look does not depend on the viewer's system fonts.
  # Playfair Display, SIL Open Font License 1.1 - see assets/fonts/OFL.txt.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
